<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>BCS Monster - Magical Learning Launchpad</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23FF7EB3'/%3E%3Cstop offset='50%25' stop-color='%237A77FF'/%3E%3Cstop offset='100%25' stop-color='%2300E5B0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FFF'/%3E%3C/svg%3E" />

    <!-- Apply theme + device capability flags BEFORE first paint: no wrong-theme flash. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'light';
        try {
          var saved = localStorage.getItem('bcs-monster-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        root.setAttribute('data-theme', theme);
        if (theme === 'dark') root.classList.add('dark');
        root.style.colorScheme = theme;
        // Lower-powered devices get cheaper glass (no live backdrop blur).
        try {
          var lowCpu = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
          var lowMem = navigator.deviceMemory && navigator.deviceMemory <= 4;
          if (lowCpu || lowMem) root.setAttribute('data-perf', 'lite');
        } catch (e) {}
      })();
    </script>
    <!-- Inline critical background so the very first frame already has the right colour. -->
    <style>
      html { background-color: #F6F2FF; }
      html[data-theme='dark'] { background-color: #0E0B20; }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="./Uttoron.png" />
    <!-- Non-render-blocking font stylesheet (swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"

      />
    </noscript>
    <script type="module" crossorigin src="./assets/index--gTVPoUv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CtlubkQx.css">
  </head>
