<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f6f2ff; padding: 24px; color: #1a1648;">
    <div style="max-width: 460px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 28px; border: 1px solid #e2d9ff;">
      <h2 style="margin: 0 0 8px; color: #4f46e5;">BCS Monster Password Reset Code</h2>
      <p style="margin: 0 0 18px; font-size: 14px; color: #433e72;">
        Enter this 6-digit verification code in BCS Monster to set a new password:
      </p>
      <div style="font-size: 32px; font-weight: 800; letter-spacing: 8px; text-align: center; padding: 16px; border-radius: 14px; background: #eef2ff; color: #312e81; margin-bottom: 18px;">
        {{ .Token }}
      </div>
      <p style="margin: 0 0 14px; font-size: 12px; color: #645f94;">
        This code expires in 10 minutes. If you didn't request a password reset, you can safely ignore this email.
      </p>
      <p style="margin: 0; font-size: 12px;">
        <a href="{{ .ConfirmationURL }}" style="color: #4f46e5; font-weight: 600;">Reset Password Link</a>
      </p>
    </div>
  </body>
</html>
